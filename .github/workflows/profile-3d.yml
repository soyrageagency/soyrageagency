name: 3D Contribution Calendar

# Genera el calendario 3D DENTRO de este repo.
# A diferencia de los servicios de terceros (github-readme-stats,
# activity-graph...) esto no puede caerse: no depende del Vercel de nadie.

on:
  schedule:
    - cron: "30 0 * * *"   # cada dia a las 00:30 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generar calendario 3D
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./.github/profile-3d-settings.json

      - name: Publicar los SVG generados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: actualizar calendario 3D [skip ci]"
          git push
